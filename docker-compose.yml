services:
  api:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8080:8080"
    volumes:
      - sandbox:/app/data
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 180s

  # Graph store, on the same box as the API. To use Neo4j Aura instead, point
  # NEO4J_URI at neo4j+s://<id>.databases.neo4j.io and drop the depends_on above.
  neo4j:
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-supplierrisk}
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    healthcheck:
      # a bolt TCP probe, not cypher-shell: that starts a second JVM and OOMs a 1 GB box
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/7687"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    ports:                       # localhost-only: never expose bolt/browser to the internet
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - graph:/data
    restart: unless-stopped

volumes:
  sandbox:
  graph:
