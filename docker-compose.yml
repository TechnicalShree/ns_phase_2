services:
  api:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8080:8080"
    volumes:
      - sandbox:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 180s

  # Only needed if you are NOT using Neo4j Aura. Start with:
  #   docker compose --profile local-graph up -d
  # and set NEO4J_URI=bolt://neo4j:7687 in backend/.env
  neo4j:
    image: neo4j:5.26
    profiles: ["local-graph"]
    environment:
      NEO4J_AUTH: neo4j/supplierrisk
      NEO4J_server_memory_heap_max__size: 512M
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - graph:/data
    restart: unless-stopped

volumes:
  sandbox:
  graph:
